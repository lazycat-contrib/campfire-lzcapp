version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: build/campfire.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: once-campfire

build:
  toolchains: []
  run_buildscript: false

images:
  - id: once-campfire
    target: service
    service: once-campfire
    source: ghcr.io/basecamp/once-campfire
    channel: stable
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
      max_attempts: 3
      initial_delay: 2s
      max_delay: 30s
    application:
      language: zh
      name: Campfire
      source: https://github.com/basecamp/once-campfire
      source_author: basecamp
  private:
    enabled: true
    skip_if_version_exists: true
    name: Campfire
    summary: "Campfire LazyCat package published from GitHub Actions."
